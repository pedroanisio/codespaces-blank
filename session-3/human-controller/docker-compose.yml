services:
  renderer:
    build: .
    container_name: human-body-renderer
    ports:
      - "8090:80"
    restart: unless-stopped

  dev:
    image: node:22-alpine
    container_name: human-body-dev
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "5175:5175"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    profiles:
      - dev

volumes:
  node_modules:
